name: Release VSIX

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish_release:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: extension
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate release version and notes
        id: release_meta
        env:
          release_tag: ${{ github.ref_name }}
        run: |
          if ($env:release_tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid release tag: $env:release_tag"
          }
          $release_version = $env:release_tag.Substring(1)
          $manifest = Get-Content -Raw package.json | ConvertFrom-Json
          if ($manifest.version -ne $release_version) {
            throw "Tag version does not match package.json"
          }
          if (-not (Test-Path -LiteralPath "../docs/releases/$env:release_tag.md")) {
            throw "Missing release notes"
          }
          "release_version=$release_version" >> $env:GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Generate CMake variable catalog
        run: node ../tools/var-catalog/index.mjs build

      - name: Build extension
        run: npm run build

      - name: Verify browser test prerequisites
        run: |
          $browser_paths = @(
            'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe',
            'C:\Program Files\Microsoft\Edge\Application\msedge.exe',
            'C:\Program Files\Google\Chrome\Application\chrome.exe'
          )
          if (-not ($browser_paths | Where-Object { Test-Path -LiteralPath $_ })) {
            throw "A browser is required; release tests must not be skipped"
          }

      - name: Run all tests
        run: npm test

      - name: Package VSIX
        run: npm run package

      - name: Prepare versioned package and checksum
        env:
          release_version: ${{ steps.release_meta.outputs.release_version }}
        run: |
          $package_name = "cmake-presets-editor-$env:release_version.vsix"
          $package_path = Join-Path build $package_name
          Copy-Item -LiteralPath build/cmake-presets-editor.vsix -Destination $package_path
          $package_hash = (Get-FileHash -LiteralPath $package_path -Algorithm SHA256).Hash.ToLowerInvariant()
          "$package_hash  $package_name" | Set-Content -LiteralPath "$package_path.sha256" -Encoding utf8NoBOM

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          release_tag: ${{ github.ref_name }}
          release_version: ${{ steps.release_meta.outputs.release_version }}
        run: |
          $package_path = "build/cmake-presets-editor-$env:release_version.vsix"
          gh release create $env:release_tag $package_path "$package_path.sha256" `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --latest `
            --title "CMake Presets Editor $env:release_tag" `
            --notes-file "../docs/releases/$env:release_tag.md"
