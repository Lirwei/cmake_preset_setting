<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMake 变量目录 · 数据校验</title>
<style>
  :root{
    --bg:#1e1e1e; --panel:#252526; --border:#333; --text:#d4d4d4; --muted:#9d9d9d;
    --accent:#007acc; --input:#3c3c3c; --hot:#4ec9b0; --bad:#e2c08d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.55 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  header{padding:18px 24px 12px;border-bottom:1px solid var(--border);background:var(--panel)}
  h1{margin:0 0 4px;font-size:17px;font-weight:600}
  .sub{color:var(--muted);font-size:12px}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 24px 60px}
  #q{width:100%;font:15px/1.4 Consolas,monospace;color:#eee;background:var(--input);
     border:1px solid #4a4a4a;border-radius:4px;padding:10px 12px}
  #q:focus{outline:none;border-color:var(--accent)}
  .bar{display:flex;gap:12px;align-items:center;margin:10px 0 16px;color:var(--muted);font-size:12px}
  .bar .spacer{flex:1}
  .hint kbd{background:#3a3d41;border-radius:3px;padding:1px 5px;font-family:Consolas,monospace;font-size:11px}
  .item{padding:9px 12px;border:1px solid #2d2d2d;border-radius:4px;margin-bottom:6px;background:#222}
  .item:hover{border-color:#3f6f9f}
  .item.sel{border-color:var(--accent);background:#20303f}
  .line1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .name{font-family:Consolas,monospace;font-size:13px;color:#dcdcaa;font-weight:600}
  .type{font-size:10px;color:var(--hot);border:1px solid #3f5f57;border-radius:3px;padding:0 4px}
  .since{font-size:10px;color:#8f8f8f}
  .tag{font-size:10px;border-radius:3px;padding:0 5px;background:#3a3d41;color:#bbb}
  .tag.prefer{background:#4a3a1e;color:var(--bad)}
  .tag.hot{background:#1e4a44;color:var(--hot)}
  .tag.proj{background:#2b3f57;color:#9ecbf5}
  .vals{margin-left:auto;color:#9d9d9d;font-size:11px;font-family:Consolas,monospace}
  .sum{margin-top:3px;color:#bdbdbd;font-size:12px;line-height:1.5}
  .empty{color:var(--muted);padding:24px 4px}
  .foot{position:fixed;left:0;right:0;bottom:0;padding:6px 24px;background:var(--panel);
        border-top:1px solid var(--border);color:#7a7a7a;font-size:11px}
</style>
</head>
<body>
<header>
  <h1>CMake 变量目录</h1>
  <div class="sub">数据来自本机 CMake __VERSION__ 的官方文档 · 共 __COUNT__ 条 · 只监听 127.0.0.1</div>
</header>
<div class="wrap">
  <input id="q" placeholder="输入 CMAKE_ 或 build 试试，例如 CMAKE_BUILD_TYPE" autocomplete="off" spellcheck="false">
  <div class="bar">
    <span id="count">—</span>
    <span class="spacer"></span>
    <span class="hint">↑↓ 选择 · Enter 打开文档 · 点击行复制变量名</span>
  </div>
  <div id="list"></div>
</div>
<div class="foot" id="foot"></div>
<script>
  var input = document.getElementById('q');
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var foot = document.getElementById('foot');
  var items = [];
  var active = -1;
  var timer = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function render() {
    if (!items.length) {
      list.innerHTML = '<div class="empty">没有匹配的变量</div>';
      return;
    }
    list.innerHTML = items.map(function (v, i) {
      var tags = '';
      if (v.hot) tags += '<span class="tag hot">常用</span>';
      if (v.preferField) tags += '<span class="tag prefer">改用预设字段 ' + esc(v.preferField) + '</span>';
      if (v.sources && v.sources.indexOf('CMakeCache') >= 0) tags += '<span class="tag proj">CMakeCache</span>';
      if (v.sources && v.sources.indexOf('CMakeLists') >= 0) tags += '<span class="tag proj">CMakeLists</span>';
      return '<div class="item' + (i === active ? ' sel' : '') + '" data-i="' + i + '">' +
        '<div class="line1">' +
        '<span class="name">' + esc(v.name) + '</span>' +
        (v.type ? '<span class="type">' + esc(v.type) + '</span>' : '') +
        (v.since ? '<span class="since">since ' + esc(v.since) + '</span>' : '') +
        tags +
        (v.values && v.values.length ? '<span class="vals">' + v.values.map(esc).join(' · ') + '</span>' : '') +
        '</div>' +
        (v.summary ? '<div class="sum">' + esc(v.summary) + '</div>' : '') +
        '</div>';
    }).join('');
    var el = list.querySelector('.item[data-i="' + active + '"]');
    if (el) el.scrollIntoView({ block: 'nearest' });
  }

  function search(q) {
    fetch('/api/search?q=' + encodeURIComponent(q) + '&limit=50')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        items = data.items || [];
        active = items.length ? 0 : -1;
        count.textContent = '匹配 ' + items.length + ' 条' + (q ? '（' + q + '）' : '');
        render();
      })
      .catch(function (e) { count.textContent = '请求失败：' + e.message; });
  }

  input.addEventListener('input', function () {
    clearTimeout(timer);
    var q = input.value;
    timer = setTimeout(function () { search(q); }, 120);
  });

  input.addEventListener('keydown', function (e) {
    if (!items.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      active = (active + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      render();
    } else if (e.key === 'Enter' && active >= 0) {
      e.preventDefault();
      copy(items[active].name);
    }
  });

  function copy(name) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(name).then(function () {
        foot.textContent = '已复制 ' + name;
        setTimeout(function () { foot.textContent = ''; }, 1600);
      });
    }
  }

  list.addEventListener('click', function (e) {
    var item = e.target.closest('.item');
    if (!item) return;
    var v = items[Number(item.dataset.i)];
    copy(v.name);
  });

  fetch('/api/stats').then(function (r) { return r.json(); }).then(function (d) {
    var types = Object.keys(d.byType).sort(function (a, b) { return d.byType[b] - d.byType[a]; })
      .map(function (k) { return k + ':' + d.byType[k]; }).join('  ');
    foot.textContent = d.count + ' 条 · ' + types;
  }).catch(function () {});

  search('');
  input.focus();
</script>
</body>
</html>
